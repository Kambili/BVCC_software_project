<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)"/>

  <!-- Chart bars representing data visualization -->
  <g transform="translate(16, 18)">
    <!-- Bar 1 - short -->
    <rect x="2" y="18" width="5" height="8" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 2 - tall -->
    <rect x="9" y="8" width="5" height="18" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 3 - medium -->
    <rect x="16" y="12" width="5" height="14" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 4 - tallest -->
    <rect x="23" y="4" width="5" height="22" fill="url(#chartGradient)" rx="1"/>

    <!-- Trend line overlaying the bars -->
    <path d="M 4.5 22 L 11.5 13 L 18.5 16 L 25.5 8"
          stroke="#FCD34D"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Dots on the trend line -->
    <circle cx="4.5" cy="22" r="1.5" fill="#FCD34D"/>
    <circle cx="11.5" cy="13" r="1.5" fill="#FCD34D"/>
    <circle cx="18.5" cy="16" r="1.5" fill="#FCD34D"/>
    <circle cx="25.5" cy="8" r="1.5" fill="#FCD34D"/>
  </g>

  <!-- Sparkle/insight icon in top right -->
  <g transform="translate(44, 14)">
    <path d="M 0 0 L 1 3 L 4 4 L 1 5 L 0 8 L -1 5 L -4 4 L -1 3 Z"
          fill="#FCD34D"
          opacity="0.9"/>
  </g>
</svg>
